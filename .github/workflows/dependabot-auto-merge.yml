name: Dependabot auto-merge

on: pull_request

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Fetch Dependabot metadata
        id: meta
        uses: dependabot/fetch-metadata@v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # No `gh pr review --approve` step: GitHub hard-blocks Actions from
      # approving PRs ("GitHub Actions is not permitted to approve pull
      # requests"), and no branch protection requires a review anyway. The
      # approve call was the original bug: it errored and killed the job before
      # the merge ran.
      #
      # No `--auto` either: this repo has no required status checks, so there is
      # nothing for auto-merge to wait on. An immediate squash merge is the same
      # call that merges these PRs reliably by hand. Trade-off: a bad bump can
      # land on main without waiting for Vercel, which is acceptable for
      # patch/minor + Actions bumps (Vercel never promotes a failing build to
      # production). To gate on Vercel, make it a required check via a ruleset
      # and switch to `--auto` (a required check also gates direct pushes).
      - name: Auto-merge npm patch + minor
        if: steps.meta.outputs.package-ecosystem == 'npm_and_yarn' && (steps.meta.outputs.update-type == 'version-update:semver-patch' || steps.meta.outputs.update-type == 'version-update:semver-minor')
        run: gh pr merge --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Auto-merge GitHub Actions (all bumps, first-party only)
        if: steps.meta.outputs.package-ecosystem == 'github_actions'
        run: gh pr merge --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
