name: Dependabot auto-merge

on: pull_request

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Fetch Dependabot metadata
        id: meta
        uses: dependabot/fetch-metadata@v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # Note: no `gh pr review --approve` step. GitHub hard-blocks Actions from
      # approving PRs, and there is no branch protection requiring a review, so
      # the approval is both impossible and unnecessary.
      #
      # `--auto` only sticks when the PR has a pending merge requirement (a
      # required check/review) to wait on. This repo has no branch protection,
      # so once checks settle the PR is immediately mergeable and `--auto`
      # errors with "Pull request is in clean status". The `|| gh pr merge`
      # fallback does an immediate squash merge in that case. Either path merges.
      - name: Auto-merge npm patch + minor
        if: steps.meta.outputs.package-ecosystem == 'npm_and_yarn' && (steps.meta.outputs.update-type == 'version-update:semver-patch' || steps.meta.outputs.update-type == 'version-update:semver-minor')
        run: gh pr merge --auto --squash "$PR_URL" || gh pr merge --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Auto-merge GitHub Actions (all bumps, first-party only)
        if: steps.meta.outputs.package-ecosystem == 'github_actions'
        run: gh pr merge --auto --squash "$PR_URL" || gh pr merge --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
